name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build Web App and Sync Capacitor
        run: npm run cap:sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Package OTA updates and APK
        run: |
          mkdir deploy_out
          cd dist
          zip -r ../deploy_out/dist.zip .
          cd ..
          echo '{
            "version": "1.0.${{ github.run_number }}",
            "url": "https://musabaqa.kauzariyya.com/uploads/dist.zip"
          }' > deploy_out/app-web-version.json
          cp android/app/build/outputs/apk/debug/app-debug.apk ./deploy_out/kauzariyya-musabaqa.apk

      - name: Deploy to Web Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/uploads/
          local-dir: ./deploy_out/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kauzariyya-musabaqa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
